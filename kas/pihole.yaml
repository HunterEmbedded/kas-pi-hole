      meta-oe:
      meta-networking:
      meta-multimedia:
      meta-python:

  meta-hunter-embedded:
    url: https://github.com/HunterEmbedded/meta-hunterembedded.git
    path: sources/meta-hunter-embedded
    branch: scarthgap-pi-hole-6.0.6

  meta-rauc:
    url: https://github.com/rauc/meta-rauc
