header:
  version: 13
  includes:
    - pihole.yaml

machine: raspberrypi4-64

repos:
  meta-raspberrypi:
    url: http://git.yoctoproject.org/meta-raspberrypi
    commit: 3b27c95c163a042f8056066ec3d27edfcc42da7f
    path: sources/meta-raspberrypi
  
  meta-rauc-community:
    url: http://github.com/rauc/meta-rauc-community
    commit: 396e54f1aba0057b5b70d04f396691994c07c7c5
    path: sources/meta-rauc-community
    layers:
      meta-rauc-raspberrypi:

local_conf_header:
  rpi4: |
      # allows serial terminal 
      ENABLE_UART = "1"
  licenses: |
      # this is required to pull in cypress wifi code
      LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
  debug: |
      # this allows login with passwordless root user
      EXTRA_IMAGE_FEATURES = "debug-tweaks"
  bbmasks: |
      # replaced by meta-hunterembedded version 
      BBMASK:append = " meta-rauc-community/meta-rauc-raspberrypi/recipes-core/base-files/base-files_%.bbappend"


